<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Регистрация')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><h1>Регистрация</h1><div th:if="${error}" class="alert alert-error" th:text="${error}"></div><form class="form" method="post" th:action="@{/register}" th:object="${request}"><label>Логин</label><input th:field="*{username}"><span class="error" th:errors="*{username}"></span><label>Email</label><input type="email" th:field="*{email}"><span class="error" th:errors="*{email}"></span><label>ФИО</label><input th:field="*{fullName}"><span class="error" th:errors="*{fullName}"></span><label>Адрес</label><input th:field="*{address}"><label>Телефон</label><input th:field="*{phone}"><span class="error" th:errors="*{phone}"></span><label>Пароль</label><input type="password" th:field="*{password}"><span class="error" th:errors="*{password}"></span><label>Повтор пароля</label><input type="password" th:field="*{passwordConfirmation}"><span class="error" th:errors="*{passwordConfirmation}"></span><button class="btn btn-primary">Зарегистрироваться</button></form></main></body></html>
