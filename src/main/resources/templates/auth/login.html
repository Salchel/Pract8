<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Вход')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><h1>Вход</h1><div th:if="${param.error}" class="alert alert-error">Неверный логин или пароль</div><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><form class="form" method="post" th:action="@{/login}"><label>Логин</label><input name="username" required><label>Пароль</label><input type="password" name="password" required><div class="form-buttons"><button class="btn btn-primary">Войти</button><a class="btn" th:href="@{/register}">Регистрация</a></div></form></main></body></html>
