<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Мои заказы')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><h1>Мои заказы</h1><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><table class="table"><tr><th>№</th><th>Дата</th><th>Статус</th><th>Сумма</th></tr><tr th:each="o:${orders}"><td th:text="${o.id}"></td><td th:text="${#temporals.format(o.orderDate,'dd.MM.yyyy HH:mm')}"></td><td th:text="${o.status}"></td><td th:text="${o.totalAmount}"></td></tr></table></main></body></html>
