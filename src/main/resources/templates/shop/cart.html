<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Корзина')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><h1>Корзина</h1><div th:if="${error}" class="alert alert-error" th:text="${error}"></div><table class="table"><tr><th>Товар</th><th>Цена</th><th>Количество</th><th>Сумма</th></tr><tr th:each="i:${cart.items}"><td th:text="${i.product.title}"></td><td th:text="${i.priceAtPurchase}"></td><td><form method="post" th:action="@{/cart/items/{id}(id=${i.id})}"><input type="number" min="0" name="quantity" th:value="${i.quantity}"><button class="btn">Обновить</button></form></td><td th:text="${i.priceAtPurchase*i.quantity}"></td></tr></table><h2 th:text="${'Итого: '+cart.totalAmount+' ₽'}"></h2><form method="post" th:action="@{/cart/checkout}"><button class="btn btn-primary" th:disabled="${cart.items.empty}">Оформить заказ</button></form></main></body></html>
