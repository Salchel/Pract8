<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Пользователи')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><h1>Пользователи и роли</h1><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><form class="search"><input name="q" th:value="${q}" placeholder="ID, логин, email или ФИО"><button class="btn">Найти</button></form><table class="table"><tr><th>ID</th><th>Логин</th><th>Email</th><th>ФИО</th><th>Роль</th></tr><tr th:each="u:${users}"><td th:text="${u.id}"></td><td th:text="${u.username}"></td><td th:text="${u.email}"></td><td th:text="${u.fullName}"></td><td><form method="post" th:action="@{/admin/users/{id}/role(id=${u.id})}"><select name="roleId"><option th:each="r:${roles}" th:value="${r.id}" th:text="${r.name}" th:selected="${r.id==u.role.id}"></option></select><button class="btn">Сохранить</button></form></td></tr></table></main></body></html>
