<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Категории')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><h1>Категории</h1><div th:if="${success}" class="alert alert-success" th:text="${success}"></div><div th:if="${error}" class="alert alert-error" th:text="${error}"></div><div class="toolbar"><form class="search"><input name="q" th:value="${q}" placeholder="ID или название"><button class="btn">Найти</button></form><a class="btn btn-primary" th:href="@{/categories/new}">+ Добавить</a></div><table class="table"><tr><th>ID</th><th>Название</th><th>Описание</th><th></th></tr><tr th:each="c:${categories}"><td th:text="${c.id}"></td><td th:text="${c.name}"></td><td th:text="${c.description}"></td><td class="actions"><a class="btn" th:href="@{/categories/{id}/edit(id=${c.id})}">Изменить</a><form method="post" th:action="@{/categories/{id}/delete(id=${c.id})}"><button class="btn btn-danger">Удалить</button></form></td></tr></table></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
