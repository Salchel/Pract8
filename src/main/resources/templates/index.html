<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/layout :: head('Главная')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><section class="hero"><h1>Здоровье начинается с заботы</h1><p>Лекарства и товары для здоровья с удобным оформлением заказа онлайн.</p><a class="btn btn-primary" th:href="@{/products}">Перейти в каталог</a></section><h2>Товары</h2><section class="cards"><article class="card" th:each="p:${products}"><h3 th:text="${p.title}"></h3><p th:text="${p.description}"></p><strong th:text="${p.price+' ₽'}"></strong><p th:text="${p.stockQuantity>0?'В наличии':'Нет в наличии'}"></p><form sec:authorize="isAuthenticated()" method="post" th:action="@{/cart/add/{id}(id=${p.id})}"><button class="btn btn-primary" th:disabled="${p.stockQuantity==0}">В корзину</button></form></article></section></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
