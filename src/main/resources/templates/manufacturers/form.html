<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Производитель')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container">
    <h1 th:text="${manufacturer.id == null} ? 'Новый производитель' : 'Редактирование производителя'"></h1>

    <form th:action="@{/manufacturers}" th:object="${manufacturer}" method="post" class="form">
        <input type="hidden" th:field="*{id}">

        <label for="name">Название</label>
        <input type="text" id="name" th:field="*{name}"
               th:classappend="${#fields.hasErrors('name')} ? 'invalid'">
        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>

        <label for="country">Страна</label>
        <input type="text" id="country" th:field="*{country}"
               th:classappend="${#fields.hasErrors('country')} ? 'invalid'">
        <span class="error" th:if="${#fields.hasErrors('country')}" th:errors="*{country}"></span>

        <div class="form-buttons">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a th:href="@{/manufacturers}" class="btn btn-light">Отмена</a>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
